<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>Registration-Forms</h1>
   <label for="StudentID">Student ID</label><br>
   <input type="StudentID" id="" name="" required><br>

   <label for="Fullname">Fullname</label><br>
   <input type="Fullname" name="" required><br>

   <label for="Email">Email</label><br>
   <input type="Email" id="" name="" required><br>

   <label for="Password">Password</label><br>
   <input type="Password" id="" name="" required><br>

   <p>Please select your gender</p>
   <label for="Male">Male</label>
   <input type="radio" name="gender" id="Male" required>
   <label for="Female">Female</label>
   <input type="radio" name="gender" id="Female" required><br><br>

   <label for="Course">Course:</label><br>
   <select name="Course" id="Course">
        <option value="">Select Course</option>
        <option value="BSIT">BSIT</option>
        <option value="BSCS">BSCS</option>
        </select><br><br>
    
</body>
</html>
